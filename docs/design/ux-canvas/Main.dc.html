<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { viewsOpen: false, view: 'All unresolved' }; }
  renderVals() {
    const S = {
      'Open': ['background:#e7f1ff;color:#1d5fd1', 'background:#2f7cf6'],
      'Pending': ['background:#fff4e0;color:#a35a00', 'background:#f08c00'],
      'Waiting on customer': ['background:#f1edfd;color:#5b3fc4', 'background:#7c5ce4'],
      'Resolved': ['background:#e8f7ee;color:#1a7f45', 'background:#22a55b'],
    };
    const P = { Low: '#868e96', Medium: '#2f7cf6', High: '#f08c00', Urgent: '#e03131' };
    const SLA = { ok: 'background:#e8f7ee;color:#1a7f45', soon: 'background:#fff4e0;color:#a35a00', over: 'background:#fdecec;color:#c42b2b', paused: 'background:#f1f3f5;color:#495057' };
    const rows = [
      ['#28', 'Manager approvals stuck in pending', 'Sneha Kapoor · Globex India', 'Open', 'High', 'over', 'Overdue 27m', 'HP', 'Hari Prasath', '2m ago'],
      ['#12', 'Payment failed but amount debited', 'Ananya Das · Initech Pvt Ltd', 'Open', 'Urgent', 'over', 'Overdue 25m', 'PN', 'Priya Nair', '4m ago'],
      ['#26', 'Payslips for 3 employees are blank', 'Kavya Reddy · Acme Corp', 'Open', 'Medium', 'soon', 'Due in 25m', '–', 'Unassigned', '8m ago'],
      ['#6', 'Geofence check-in fails at the Pune warehouse', 'Mohammed Irfan · Umbrella Logistics', 'Open', 'Urgent', 'soon', 'Due in 40m', '–', 'Unassigned', '9m ago'],
      ['#25', 'Biometric sync stopped since yesterday', 'Rahul Verma · Globex India', 'Open', 'Medium', 'ok', 'Reply in 17h 50m', 'PN', 'Priya Nair', '12m ago'],
      ['#27', 'How do I add a new shift pattern?', 'Lakshmi Iyer · Umbrella Logistics', 'Pending', 'Low', 'ok', 'Reply in 1d 9h', 'SM', 'Sanjay Menon', '15m ago'],
      ['#24', 'Unable to apply leave for next week', 'Fatima Sheikh', 'Open', 'Medium', 'ok', 'Reply in 17h 50m', '–', 'Unassigned', '18m ago'],
      ['#23', 'Demo request for 50 employees', 'Meera Pillai', 'Open', 'Medium', 'ok', 'Reply in 17h 50m', 'SM', 'Sanjay Menon', '18m ago'],
      ['#2', 'October payslips show wrong PF deduction', 'Arjun Mehta · Acme Corp', 'Open', 'High', 'ok', 'Resolve in 17h 50m', 'RK', 'Ravi Kumar', '19m ago'],
      ['#1', 'Employees cannot mark attendance from the mobile app', 'Rahul Verma · Globex India', 'Open', 'Urgent', 'ok', 'Resolve in 13h 50m', 'PN', 'Priya Nair', '20m ago'],
      ['#11', 'Overtime not calculated for night shift', 'Mohammed Irfan · Umbrella Logistics', 'Pending', 'High', 'ok', 'Reply in 1d 9h', 'NI', 'Neha Iyer', '21m ago'],
      ['#4', 'Leave balance not carried forward to 2027', 'Sneha Kapoor · Globex India', 'Waiting on customer', 'Medium', 'paused', 'Paused · waiting', 'HP', 'Hari Prasath', '22m ago'],
      ['#18', 'Upgrade to Premium plan for 400 employees', 'Arjun Mehta · Acme Corp', 'Pending', 'Medium', 'ok', 'Resolve in 2d 6h', 'HP', 'Hari Prasath', '23m ago'],
      ['#15', 'App crashes on Android 14 when uploading selfie', 'Rahul Verma · Globex India', 'Open', 'High', 'ok', 'Reply in 3h 40m', 'SM', 'Sanjay Menon', '24m ago'],
    ];
    const av = 'width:22px;height:22px;border-radius:999px;background:#d8f0ed;color:#0a6f63;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none';
    const avNone = 'width:22px;height:22px;border-radius:999px;border:1px dashed #d1d5db;color:#676d7b;font-size:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;box-sizing:border-box';
    const tickets = rows.map(([num, subject, who, status, prio, slaKind, sla, ini, assignee, upd]) => ({
      num, subject, who, status, prio, sla, ini: ini === '–' ? '' : ini, assignee, upd,
      statusStyle: S[status][0], statusDot: S[status][1], prioDot: 'background:' + P[prio], slaStyle: SLA[slaKind],
      avStyle: ini === '–' ? avNone : av,
    }));
    const names = ['All unresolved', 'My unresolved', 'Unassigned', 'All tickets', 'Resolved and closed', 'Trash'];
    const views = names.map((name) => ({
      name,
      cls: name === this.state.view ? 'menu-item on' : 'menu-item',
      pick: () => this.setState({ view: name, viewsOpen: false }),
    }));
    return {
      tickets, views, viewName: this.state.view, viewsOpen: this.state.viewsOpen,
      toggleViews: () => this.setState({ viewsOpen: !this.state.viewsOpen }),
    };
  }
}
</script>
