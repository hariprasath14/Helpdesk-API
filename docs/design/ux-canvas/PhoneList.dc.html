<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone ticket list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: Satoshi; src: url("/_blob/c2f8d14f91715996350f7d5819d785c9") format("woff2"); font-weight: 300 900; }
body { margin: 0; }
a { color: #0a6f63; } a:hover { color: #053c36; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-bottom: 1px solid #e5e7eb; background: #fff; text-decoration: none; color: #212529; }
.opt { display: flex; align-items: center; justify-content: space-between; min-height: 48px; border-bottom: 1px solid #e5e7eb; font-size: 15px; }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #f5f6f8; font-family: Satoshi, system-ui, sans-serif; color: #212529;">
  <header style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px; background: #fff; border-bottom: 1px solid #e5e7eb; flex: none;">
    <button aria-label="Menu" style="width: 44px; height: 44px; border: 0; background: none; color: #505756;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></button>
    <img src="/_blob/a0c201e08955ad1c872f7ee2ba174fbd" alt="Helpdesk" style="height: 26px; width: auto;">
    <div style="flex-grow: 1;"></div>
    <a href="Home.dc.html" aria-label="Notifications, 3 unread" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #505756;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg><span style="position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; border-radius: 999px; background: #e03131; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</span></a>
    <span style="width: 32px; height: 32px; border-radius: 999px; background: #d8f0ed; color: #0a6f63; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">HP</span>
  </header>
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 10px; flex: none;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button style="display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; font-size: 20px; font-weight: 700; color: #1d2026;">All unresolved<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px;"><path d="m6 9 6 6 6-6"></path></svg></button>
      <span style="font-size: 13px; color: #676d7b;">24</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <label style="display: flex; align-items: center; gap: 8px; flex-grow: 1; height: 44px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; color: #676d7b; box-sizing: border-box;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px;"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg><input aria-label="Search tickets" placeholder="Search tickets" style="border: 0; background: none; font: inherit; font-size: 15px; outline: none; min-width: 0; flex-grow: 1;"></label>
      <button onClick="{{openSheet}}" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border: 1px solid #added9; border-radius: 10px; background: #ecf7f6; color: #0a6f63; font: inherit; font-size: 15px; font-weight: 500;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px;"><path d="M10 5H3"></path><path d="M12 19H3"></path><path d="M14 3v4"></path><path d="M16 17v4"></path><path d="M21 12h-9"></path><path d="M21 19h-5"></path><path d="M21 5h-7"></path><path d="M8 10v4"></path><path d="M8 12H3"></path></svg>Filters (3)</button>
    </div>
  </div>
  <div style="flex-grow: 1; overflow-y: auto; padding-bottom: 96px;">
    <sc-for list="{{tickets}}" as="t" hint-placeholder-count="6">
      <a class="card" href="PhoneTicket.dc.html">
        <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #676d7b;"><span>{{t.num}} · {{t.who}}</span><span>{{t.upd}}</span></div>
        <b style="font-size: 15px; line-height: 1.35; color: #1d2026;">{{t.subject}}</b>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px;">
          <span class="pill" style="{{t.statusStyle}}">{{t.status}}</span>
          <span style="display: inline-flex; align-items: center; gap: 5px;"><span class="dot" style="{{t.prioDot}}"></span>{{t.prio}}</span>
          <span class="pill" style="{{t.slaStyle}}">{{t.sla}}</span>
          <span style="color: #676d7b; margin-left: auto;">{{t.assignee}}</span>
        </div>
      </a>
    </sc-for>
  </div>
  <a href="NewTicket.dc.html" aria-label="New ticket" style="position: absolute; right: 16px; bottom: 20px; width: 56px; height: 56px; border-radius: 999px; background: #0c8577; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 32px rgba(16,24,40,0.2);"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px;"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></a>
  <sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(17,24,39,0.45); display: flex; flex-direction: column; justify-content: flex-end;">
      <div style="display: flex; flex-direction: column; padding: 8px 18px 18px; background: #fff; border-radius: 18px 18px 0 0;">
        <span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #d1d5db; margin-bottom: 10px;"></span>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;"><b style="font-size: 17px;">Filters</b><button style="border: 0; background: none; font: inherit; font-size: 14px; color: #0a6f63;">Clear all</button></div>
        <div class="opt"><span>Status</span><span style="color: #676d7b;">Open, Pending, Waiting  ›</span></div>
        <div class="opt"><span>Priority</span><span style="color: #676d7b;">Any  ›</span></div>
        <div class="opt"><span>Assignee</span><span style="color: #676d7b;">Any  ›</span></div>
        <div class="opt"><span>Team</span><span style="color: #676d7b;">Any  ›</span></div>
        <div class="opt"><span>Type</span><span style="color: #676d7b;">Any  ›</span></div>
        <div class="opt"><span>Tags</span><span style="color: #676d7b;">Any  ›</span></div>
        <div class="opt"><span>Only overdue</span><span style="width: 40px; height: 24px; border-radius: 999px; background: #d1d5db; position: relative;"><span style="position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 999px; background: #fff;"></span></span></div>
        <div class="opt" style="border-bottom: 0;"><span>Order</span><span style="color: #676d7b;">Last updated  ›</span></div>
        <button onClick="{{closeSheet}}" style="height: 48px; margin-top: 8px; border: 0; border-radius: 10px; background: #0c8577; color: #fff; font: inherit; font-size: 15px; font-weight: 600;">Show 24 tickets</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sheet: false }; }
  renderVals() {
    const S = { Open: 'background:#e7f1ff;color:#1d5fd1', Pending: 'background:#fff4e0;color:#a35a00', 'Waiting on customer': 'background:#f1edfd;color:#5b3fc4' };
    const P = { Low: '#868e96', Medium: '#2f7cf6', High: '#f08c00', Urgent: '#e03131' };
    const SLA = { ok: 'background:#e8f7ee;color:#1a7f45', soon: 'background:#fff4e0;color:#a35a00', over: 'background:#fdecec;color:#c42b2b', paused: 'background:#f1f3f5;color:#495057' };
    const tickets = [
      ['#28', 'Manager approvals stuck in pending', 'Sneha Kapoor', 'Open', 'High', 'over', 'Overdue 27m', 'Hari', '2m'],
      ['#12', 'Payment failed but amount debited', 'Ananya Das', 'Open', 'Urgent', 'over', 'Overdue 25m', 'Priya', '4m'],
      ['#26', 'Payslips for 3 employees are blank', 'Kavya Reddy', 'Open', 'Medium', 'soon', 'Due in 25m', 'Unassigned', '8m'],
      ['#25', 'Biometric sync stopped since yesterday', 'Rahul Verma', 'Open', 'Medium', 'ok', 'Reply in 17h', 'Priya', '12m'],
      ['#27', 'How do I add a new shift pattern?', 'Lakshmi Iyer', 'Pending', 'Low', 'ok', 'Reply in 1d 9h', 'Sanjay', '15m'],
      ['#4', 'Leave balance not carried forward to 2027', 'Sneha Kapoor', 'Waiting on customer', 'Medium', 'paused', 'Paused', 'Hari', '22m'],
    ].map(([num, subject, who, status, prio, k, sla, assignee, upd]) => ({ num, subject, who, status, prio, sla, assignee, upd, statusStyle: S[status], prioDot: 'background:' + P[prio], slaStyle: SLA[k] }));
    return {
      tickets, sheet: this.state.sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
    };
  }
}
</script>
</body>
</html>
